<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10201e">
<title>Pour Guide</title>
<style>
:root{--bg:#10201e;--sf:#183029;--ln:#2a4a41;--am:#f0a53a;--ok:#8fd694;--bad:#ff6b5e;--tx:#eee9dc;--mu:#8fa89f;color-scheme:dark}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font:16px/1.4 ui-rounded,"SF Pro Rounded",system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);-webkit-tap-highlight-color:transparent}
#app{max-width:480px;margin:0 auto;padding:16px;min-height:100%;display:flex;flex-direction:column;gap:14px}
h1{font-size:26px;letter-spacing:-.02em}
h2{font-size:20px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
button{font:inherit;color:var(--tx);background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:12px 16px;cursor:pointer}
button:active{transform:scale(.98)}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--am);outline-offset:2px}
button.pri{background:var(--am);color:#2a1a02;border-color:var(--am);font-weight:700}
button.big{padding:16px;font-size:18px;width:100%}
button:disabled{opacity:.4}
.pill{font-size:14px;padding:8px 12px;border-radius:99px;display:flex;align-items:center;gap:8px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--mu)}
.on .dot{background:var(--ok)}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:16px}
.rec{display:flex;align-items:center;gap:12px;padding:14px;width:100%;text-align:left}
.rec b{display:block;font-size:18px}
.rec small,.mu{color:var(--mu)}
.sw{display:flex;height:34px;width:12px;border-radius:6px;overflow:hidden;flex-direction:column-reverse;flex:none}
.sw i{display:block}
.row{display:flex;gap:10px}
.row>*{flex:1}
.list{display:flex;flex-direction:column;gap:8px}
.li{display:flex;align-items:center;gap:10px;padding:12px 14px}
.li .c{width:12px;height:12px;border-radius:50%;flex:none}
.li span:last-child{margin-left:auto;color:var(--mu);font-variant-numeric:tabular-nums}
.li.cur{border-color:var(--am)}
.li.done{opacity:.55}
.gauge{position:relative;width:min(100%,340px);margin:0 auto}
.gauge svg{width:100%;height:auto;display:block}
.gauge .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none}
.num{font-size:64px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1}
.num small{font-size:22px;font-weight:500;color:var(--mu)}
.tgt{font-size:18px;color:var(--mu);margin-top:4px;font-variant-numeric:tabular-nums}
.ing{font-size:26px;font-weight:700;text-align:center}
.msg{text-align:center;min-height:24px;color:var(--mu)}
.msg.ok{color:var(--ok)}.msg.bad{color:var(--bad)}
textarea{width:100%;min-height:200px;background:var(--sf);color:var(--tx);border:1px solid var(--ln);border-radius:14px;padding:12px;font:15px/1.5 ui-monospace,Menlo,monospace}
input[type=text]{width:100%;background:var(--sf);color:var(--tx);border:1px solid var(--ln);border-radius:14px;padding:12px;font:inherit}
.note{font-size:14px;color:var(--mu)}
.warn{background:#3a2a12;border:1px solid #6b4a14;border-radius:12px;padding:10px 12px;font-size:14px}
.sp{flex:1}
@media (prefers-reduced-motion:no-preference){#liq{transition:y .25s,height .25s}#arc{transition:stroke-dashoffset .25s}}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
/* ---------- data ---------- */
const PAL=['#e8c15a','#e86a4a','#7fc8a9','#c58be0','#f0a53a','#6fb7e8'];
const BUILTIN=[
 {n:'Margarita',i:[['Tequila',50,.94,'#e8c15a'],['Triple sec',25,1,'#f0a53a'],['Lime juice',25,1.03,'#a9d36b']]},
 {n:'Daiquiri',i:[['White rum',60,.94,'#e8dfc0'],['Lime juice',25,1.03,'#a9d36b'],['Simple syrup',15,1.23,'#f3e3a8']]},
 {n:'Whiskey sour',i:[['Bourbon',50,.94,'#c9822b'],['Lemon juice',25,1.03,'#f2e06a'],['Simple syrup',20,1.23,'#f3e3a8']]},
 {n:'Negroni',i:[['Gin',30,.94,'#cfe3e0'],['Campari',30,1,'#e0453a'],['Sweet vermouth',30,1.03,'#8a3a2a']]},
 {n:'Moscow mule',i:[['Vodka',50,.94,'#dfe8ea'],['Lime juice',15,1.03,'#a9d36b'],['Ginger beer',120,1,'#e8c15a']]},
 {n:'Cosmopolitan',i:[['Vodka',40,.94,'#dfe8ea'],['Triple sec',15,1,'#f0a53a'],['Cranberry juice',30,1.04,'#d6405a'],['Lime juice',15,1.03,'#a9d36b']]},
 {n:'Gin & tonic',i:[['Gin',50,.94,'#cfe3e0'],['Tonic water',150,1,'#bfe6ef']]}
];
let custom=[];try{custom=JSON.parse(localStorage.getItem('pg.custom')||'[]')}catch(e){}
const saveCustom=()=>{try{localStorage.setItem('pg.custom',JSON.stringify(custom))}catch(e){}};
const recipes=()=>[...BUILTIN,...custom.map(r=>({...r,custom:1}))];

/* ---------- scale (Timemore Dot, service 0xFFF0) ---------- */
const hex=s=>Uint8Array.from(s.match(/../g).map(b=>parseInt(b,16)));
const INIT=['A55A021300000000','A55A020800000000','A55A020500000000','A55A020200000000','A55A020600000000','A55A020C00000000'];
const POLL=['A55A020800000000','A55A030800020100000025'];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const S={dev:null,tx:null,raw:0,off:0,conn:false,sim:false,busy:false,poll:0,err:''};
const W=()=>S.raw-S.off;
async function send(h){if(!S.tx)return;const b=hex(h);try{S.tx.writeValueWithoutResponse?await S.tx.writeValueWithoutResponse(b):await S.tx.writeValue(b)}catch(e){}}
async function pollOnce(){await send(POLL[0]);await sleep(100);await send(POLL[1])}
async function connect(all){
 if(!navigator.bluetooth){S.err='nobt';return head()}
 S.err='';S.busy=true;head();
 try{
  const opt={optionalServices:[0xFFF0,0xFFE0]};
  S.dev=await navigator.bluetooth.requestDevice(all?{acceptAllDevices:true,...opt}:{filters:[{services:[0xFFF0]},{namePrefix:'TIMEMORE'}],...opt});
  S.dev.addEventListener('gattserverdisconnected',()=>{S.conn=false;clearInterval(S.poll);head();if(view==='pour')show()});
  const srv=await S.dev.gatt.connect();
  const svc=await srv.getPrimaryService(0xFFF0);
  const rx=await svc.getCharacteristic(0xFFF1);
  S.tx=await svc.getCharacteristic(0xFFF2);
  rx.addEventListener('characteristicvaluechanged',e=>{
   const d=e.target.value;
   if(d.byteLength>=10&&d.getUint8(0)===0xA5&&d.getUint8(1)===0x5A&&d.getUint8(2)===1){S.raw=d.getInt16(8)/10;tick()}
  });
  await rx.startNotifications();
  S.conn=true;S.sim=false;head();
  for(let p=0;p<2;p++){for(const f of INIT){await send(f);await sleep(150)}await sleep(300)}
  await pollOnce();S.poll=setInterval(pollOnce,10000);
 }catch(e){if(!/cancel|chosen/i.test(e.message||''))S.err=e.message||'failed';S.conn=false}
 S.busy=false;head();
}
function disconnect(){clearInterval(S.poll);try{S.dev&&S.dev.gatt.connected&&S.dev.gatt.disconnect()}catch(e){}S.conn=false;head()}
const live=()=>S.conn||S.sim;

/* ---------- pour session ---------- */
let view='home',R=null,step=0,base=0,actual=[],hist=[],readyAt=0,wasReady=false,editing=null,wl=null;
const $=s=>document.querySelector(s);
const tol=t=>Math.max(1,t*.04);
const cur=()=>R.i[step];
const mlNow=()=>Math.max(0,(W()-base)/cur()[2]);

function beep(){try{const a=beep.a||(beep.a=new (window.AudioContext||window.webkitAudioContext)());const o=a.createOscillator(),g=a.createGain();o.frequency.value=880;g.gain.value=.15;o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+.14)}catch(e){}}
function startRecipe(r){R=r;step=0;actual=[];base=W();view='prep';wl=null;show()}
async function begin(){S.off=S.raw;base=0;view='pour';hist=[];wasReady=false;try{wl=await navigator.wakeLock.request('screen')}catch(e){}show()}
function nextStep(){
 actual[step]=mlNow();step++;base=W();hist=[];wasReady=false;readyAt=0;
 if(step>=R.i.length){view='done';try{wl&&wl.release()}catch(e){}}
 show();if(view==='pour')beep()
}
function tick(){
 if(view==='pour')gauge();
 if(view==='prep'||view==='home'){const w=$('#wnow');if(w)w.textContent=W().toFixed(1)}
}
function gauge(){
 if(!R||step>=R.i.length)return;
 const [name,t,dens,col]=cur(),ml=mlNow(),p=ml/t,tl=tol(t),now=performance.now();
 hist.push([now,ml*dens]);hist=hist.filter(h=>now-h[0]<1000);
 const rng=Math.max(...hist.map(h=>h[1]))-Math.min(...hist.map(h=>h[1]));
 const ready=ml>=t-tl&&ml<=t+tl,over=ml>t+tl;
 const q=Math.min(p,1),C=2*Math.PI*118;
 $('#arc').style.strokeDashoffset=C*(1-q);
 $('#arc').style.stroke=over?'var(--bad)':ready?'var(--ok)':col;
 const h=196*q;$('#liq').setAttribute('y',138+98-h);$('#liq').setAttribute('height',h);
 $('#liq').style.fill=over?'var(--bad)':col;
 $('#cur').textContent=ml.toFixed(ml<10?1:0);
 const m=$('#msg');
 if(over){m.className='msg bad';m.textContent='Over by '+(ml-t).toFixed(0)+' ml. Continue or reset this step.'}
 else if(ready){m.className='msg ok';m.textContent='On target'}
 else{m.className='msg';m.textContent=(t-ml).toFixed(0)+' ml to go'}
 $('#nx').className=(ready||over)?'pri big':'big';
 if(ready&&!wasReady){beep();readyAt=now}
 wasReady=ready;
 if(ready&&$('#auto').checked&&rng<.4&&now-readyAt>1300)nextStep();
}

/* ---------- views ---------- */
function head(){
 const h=$('#hd');if(!h)return;
 h.className='pill card'+(live()?' on':'');
 h.innerHTML='<span class="dot"></span>'+(S.busy?'Connecting…':S.sim?'Demo scale':S.conn?'Scale connected':'Scale offline');
}
function app(h){$('#app').innerHTML=h}
function topbar(left){return '<div class="top">'+left+'<div id="hd" class="pill card"></div></div>'}
function show(){
 if(view==='home')home();else if(view==='prep')prep();else if(view==='pour')pour();else if(view==='done')done();else if(view==='edit')edit();
 head();
}
function home(){
 const rs=recipes();
 let h=topbar('<h1>Pour guide</h1>');
 if(S.err==='nobt')h+='<div class="warn">This browser can’t use Web Bluetooth. On iPhone, open this page in the Bluefy browser. On Android or desktop, use Chrome.</div>';
 else if(S.err)h+='<div class="warn">Couldn’t connect: '+esc(S.err)+'</div>';
 if(!live())h+='<div class="row"><button class="pri" id="cn">Connect scale</button><button id="cn2">Show all devices</button></div>';
 else h+='<div class="row"><button id="dc">'+(S.sim?'Stop demo':'Disconnect')+'</button><div class="card li"><span>Scale</span><span id="wnow">'+W().toFixed(1)+'</span><span>g</span></div></div>';
 h+='<div class="list">'+rs.map((r,k)=>{
  const tot=r.i.reduce((a,x)=>a+x[1],0);
  return '<button class="card rec" data-r="'+k+'"><span class="sw">'+r.i.map(x=>'<i style="background:'+x[3]+';height:'+(x[1]/tot*100)+'%"></i>').join('')+'</span><span><b>'+esc(r.n)+'</b><small>'+r.i.map(x=>esc(x[0])).join(', ')+'</small></span></button>'}).join('')+'</div>';
 h+='<div class="row"><button id="nw">New recipe</button>'+(S.sim?'':'<button id="dm">Try demo mode</button>')+'</div>';
 if(custom.length)h+='<div class="row" style="flex-wrap:wrap">'+custom.map((r,k)=>'<button data-e="'+k+'">Edit '+esc(r.n)+'</button>').join('')+'</div>';
 h+='<p class="note">Amounts are in ml. Your scale reads grams, so each ingredient has a density that converts ml to g.</p>';
 app(h);
 $('#cn')&&($('#cn').onclick=()=>connect(false));$('#cn2')&&($('#cn2').onclick=()=>connect(true));
 $('#dc')&&($('#dc').onclick=()=>{S.sim=false;disconnect();show()});
 $('#dm')&&($('#dm').onclick=()=>{S.sim=true;S.raw=0;S.off=0;show()});
 $('#nw').onclick=()=>{editing=null;view='edit';show()};
 document.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{editing=+b.dataset.e;view='edit';show()});
 document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{
  if(!live()){S.err='';alert('Connect your scale first, or try demo mode.');return}
  startRecipe(rs[+b.dataset.r])});
}
function prep(){
 let h=topbar('<button id="bk">Back</button>')+'<h1>'+esc(R.n)+'</h1>';
 h+='<div class="list">'+R.i.map(x=>'<div class="card li"><span class="c" style="background:'+x[3]+'"></span><span>'+esc(x[0])+'</span><span>'+x[1]+' ml · '+(x[1]*x[2]).toFixed(0)+' g</span></div>').join('')+'</div>';
 h+='<div class="card li"><span>Scale now</span><span id="wnow">'+W().toFixed(1)+'</span><span>g</span></div>';
 h+='<p class="note">Put your empty glass on the scale. The scale zeroes when you start.</p><div class="sp"></div>';
 h+='<button class="pri big" id="go">Zero and start</button>';
 app(h);$('#bk').onclick=()=>{view='home';show()};$('#go').onclick=begin;
}
function pour(){
 const [name,t,dens,col]=cur();
 const C=2*Math.PI*118;
 let h=topbar('<button id="bk">Quit</button>');
 h+='<div class="ing">'+esc(name)+'</div><div class="msg" style="min-height:0">Step '+(step+1)+' of '+R.i.length+'</div>';
 h+='<div class="gauge"><svg viewBox="0 0 280 280" role="img" aria-label="Pour progress"><defs><clipPath id="cp"><circle cx="140" cy="138" r="98"/></clipPath></defs>'+
  '<circle cx="140" cy="138" r="118" fill="none" stroke="var(--ln)" stroke-width="14"/>'+
  '<g clip-path="url(#cp)"><rect x="40" y="236" width="200" height="0" id="liq" opacity=".35"/></g>'+
  '<circle id="arc" cx="140" cy="138" r="118" fill="none" stroke="'+col+'" stroke-width="14" stroke-linecap="round" stroke-dasharray="'+C+'" stroke-dashoffset="'+C+'" transform="rotate(-90 140 138)"/></svg>'+
  '<div class="mid"><div class="num"><span id="cur">0</span><small> ml</small></div><div class="tgt">of '+t+' ml</div></div></div>';
 h+='<div class="msg" id="msg"></div>';
 h+='<div class="list">'+R.i.map((x,k)=>'<div class="card li '+(k===step?'cur':k<step?'done':'')+'"><span class="c" style="background:'+x[3]+'"></span><span>'+esc(x[0])+'</span><span>'+(k<step?actual[k].toFixed(0)+' / ':'')+x[1]+' ml</span></div>').join('')+'</div>';
 h+='<label class="note"><input type="checkbox" id="auto" checked> Move on when the amount is steady</label>';
 if(S.sim)h+='<button id="hold">Hold to pour (demo)</button>';
 h+='<div class="sp"></div><div class="row"><button id="rs">Reset step</button><button class="big" id="nx">'+(step===R.i.length-1?'Finish':'Next')+'</button></div>';
 app(h);
 $('#bk').onclick=()=>{try{wl&&wl.release()}catch(e){}view='home';show()};
 $('#nx').onclick=nextStep;
 $('#rs').onclick=()=>{base=W();hist=[];gauge()};
 const hb=$('#hold');
 if(hb){let iv;const go=e=>{e.preventDefault();clearInterval(iv);iv=setInterval(()=>{S.raw+=1.2;tick()},100)},st=()=>clearInterval(iv);
  hb.onpointerdown=go;['pointerup','pointerleave','pointercancel'].forEach(ev=>hb['on'+ev]=st)}
 gauge();
}
function done(){
 let h=topbar('')+'<h1>'+esc(R.n)+' is ready</h1><div class="list">'+R.i.map((x,k)=>'<div class="card li"><span class="c" style="background:'+x[3]+'"></span><span>'+esc(x[0])+'</span><span>'+actual[k].toFixed(0)+' / '+x[1]+' ml</span></div>').join('')+'</div><div class="sp"></div><div class="row"><button id="ag">Pour another</button><button class="pri" id="hm">Done</button></div>';
 app(h);$('#ag').onclick=()=>startRecipe(R);$('#hm').onclick=()=>{view='home';show()};
}
function edit(){
 const r=editing!==null?custom[editing]:null;
 let h=topbar('<button id="bk">Cancel</button>')+'<h2>'+(r?'Edit recipe':'New recipe')+'</h2>';
 h+='<input type="text" id="rn" placeholder="Recipe name" value="'+(r?esc(r.n):'')+'">';
 h+='<textarea id="rt" spellcheck="false" placeholder="One ingredient per line:\nname, ml, density\n\nGin, 50, 0.94\nTonic water, 150">'+(r?r.i.map(x=>x[0]+', '+x[1]+', '+x[2]).join('\n'):'')+'</textarea>';
 h+='<p class="note">Density is grams per ml and is optional (water is 1, spirits about 0.94, syrups 1.2 or more).</p><div class="sp"></div><div class="row">'+(r?'<button id="rm">Delete</button>':'')+'<button class="pri" id="sv">Save recipe</button></div>';
 app(h);
 $('#bk').onclick=()=>{view='home';show()};
 $('#rm')&&($('#rm').onclick=()=>{custom.splice(editing,1);saveCustom();view='home';show()});
 $('#sv').onclick=()=>{
  const n=$('#rn').value.trim(),items=[];
  $('#rt').value.split('\n').forEach(l=>{const p=l.split(',').map(s=>s.trim());const ml=parseFloat(p[1]);if(p[0]&&ml>0)items.push([p[0],ml,parseFloat(p[2])||1,PAL[items.length%PAL.length]])});
  if(!n||!items.length){alert('Add a name and at least one ingredient line like: Gin, 50, 0.94');return}
  const rec={n,i:items};editing!==null?custom[editing]=rec:custom.push(rec);saveCustom();view='home';show()};
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
document.addEventListener('visibilitychange',async()=>{if(document.visibilityState==='visible'&&view==='pour'){try{wl=await navigator.wakeLock.request('screen')}catch(e){}}});
show();
</script>
</body>
</html>
